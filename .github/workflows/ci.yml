name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消旧的运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      # 只装 ruff，不用同步 torch/chromadb 这些重依赖，几秒就能给出风格反馈
      - name: Ruff check
        run: uvx ruff@0.16.9 check src tests scripts

      - name: Ruff format check（只检查不改写）
        run: uvx ruff@0.16.9 format --check src/dsm5_rag/background.py src/dsm5_rag/keyword_index.py src/dsm5_rag/index_manifest.py

  test:
    name: Test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      # 注意：依赖里有 torch（Linux 上会解析到较大的 wheel），同步可能要几分钟。
      # 用 --frozen 保证按 uv.lock 安装，不重新解析、不改镜像源。
      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: Lint with the project's ruff
        run: uv run ruff check src tests scripts

      # 测试全部跑在临时目录 + 假 embedding 上（tests/conftest.py），
      # 不下载 HuggingFace 权重，也不碰仓库里的真实索引目录。
      - name: Pytest with coverage
        run: uv run pytest -q --cov=dsm5_rag --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
