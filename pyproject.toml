[project]
name = "dsm5-rag"
version = "1.0.0"
description = "基于混合检索的DSM-5诊断标准知识问答系统 - 多语言版本"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenMINDS" },
]
dependencies = [
    "llama-index>=0.14.0",
    "llama-index-core>=0.14.0",
    "llama-index-llms-deepseek>=0.2.0",
    "llama-index-embeddings-huggingface>=0.6.0",
    "llama-index-vector-stores-chroma>=0.5.0",
    "chromadb>=1.4.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "python-docx>=1.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "pypdf>=6.14.2",
    "fastmcp>=3.4.0",
]

[project.scripts]
dsm5-rag-api = "dsm5_rag.api:main"
dsm5-rag-mcp = "dsm5_rag.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm5_rag"]

[[tool.uv.index]]
url = "https://uv.agentsmirror.com/pypi/simple"
default = true

[tool.hatch.build.targets.sdist]
include = ["src/dsm5_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
